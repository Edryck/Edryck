
name: Generate GitHub Metrics

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub Metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Edryck
          filename: github-metrics.svg

          # Visual
          template: classic
          config_presets: "@lunar-red"
          config_timezone: America/Sao_Paulo
          config_animations: no
          config_padding: 8

          # Informações exibidas
          base: header, repositories, metadata

          # Linguagens
          plugin_languages: yes
          plugin_languages_limit: 6
          plugin_languages_threshold: 1%
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_other: no
          plugin_languages_ignored: jupyter notebook
          plugin_languages_colors: python:#FF4040, typescript:#E00024, html:#FF7777, java:#B91C1C, dart:#A0A0A0, c:#7F0000

          # Personalização adicional
          extras_css: |
            h2 {
              color: #FF4040 !important;
            }

            a {
              color: #FF4040 !important;
            }
