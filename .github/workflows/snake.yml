
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Snake Animation
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Edryck
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23E00024&color_dots=%23EBEBEB,%23FBCACA,%23F87171,%23EF4444,%23B91C1C
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23FF4040&color_dots=%232D2D2D,%235A1717,%238F1010,%23C51D2D,%23FF4040

      - name: Publish to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
